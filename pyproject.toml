[project]
name = "PokeFastAPI"
version = "0.1.0-beta"
description = "A remake of PokeAPI using FastAPI."
authors = [
    { name = "naokimon", email = "nathancruzmartinez@gmail.com" }
]
dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "aiosqlite>=0.22.1,<0.23.0",
    "uvicorn>=0.54.0,<0.55.0",
    "pandas>=3.0.6,<3.1.0"
]

requires-python = ">=3.14,<4.0"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"